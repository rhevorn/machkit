name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Swift, app, and embedded tools
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tool/package-lock.json

      - name: Install embedded tool dependencies
        working-directory: Tool
        run: npm ci

      - name: Test embedded tools
        working-directory: Tool
        run: npm test

      - name: Test Swift core
        run: swift test

      - name: Build macOS app
        run: |
          xcodebuild \
            -project MachKit.xcodeproj \
            -scheme "MachKit App" \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/XcodeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        working-directory: Website
        run: npm ci

      - name: Test and build
        working-directory: Website
        run: |
          npm test
          npm run build
