name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Required repository secrets:
      # DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64, DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD,
      # DEVELOPER_ID_APPLICATION_IDENTITY, SIGNING_KEYCHAIN_PASSWORD,
      # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID.
      - name: Validate signing and notarization secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for variable in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Required release secret is missing: $variable" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/machkit-developer-id.p12"
          keychain_path="$RUNNER_TEMP/machkit-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$SIGNING_IDENTITY"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"

      - name: Read version from tag
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(Scripts/validate_release_version.sh "$GITHUB_REF_NAME")"
          # CFBundleVersion starts at 1000+ (run 1 → 1001, run 2 → 1002, …).
          build_number=$((1000 + RUN_NUMBER))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Run release tests
        shell: bash
        run: swift test -c release

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tool/package-lock.json

      - name: Build embedded H5 tools
        working-directory: Tool
        run: |
          npm ci
          npm test
          npm run build:app

      - name: Build Release app
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project MachKit.xcodeproj \
            -scheme "MachKit App" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/XcodeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Locate built app
        id: app
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          build_settings="$(xcodebuild \
            -project MachKit.xcodeproj \
            -scheme "MachKit App" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/XcodeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -showBuildSettings)"
          target_build_dir="$(printf '%s\n' "$build_settings" | awk -F ' = ' '/^[[:space:]]*TARGET_BUILD_DIR = / { print $2; exit }')"
          wrapper_name="$(printf '%s\n' "$build_settings" | awk -F ' = ' '/^[[:space:]]*WRAPPER_NAME = / { print $2; exit }')"
          app_path="$target_build_dir/$wrapper_name"
          if [[ -z "$target_build_dir" || -z "$wrapper_name" || ! -d "$app_path" ]]; then
            echo "Unable to locate built app from Xcode build settings: $app_path" >&2
            exit 1
          fi
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Verify bundled version
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          info_plist="$APP_PATH/Contents/Info.plist"
          bundled_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          bundled_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          if [[ "$bundled_version" != "$VERSION" ]]; then
            echo "Bundled version $bundled_version does not match tag version $VERSION" >&2
            exit 1
          fi
          if [[ "$bundled_build" != "$BUILD_NUMBER" ]]; then
            echo "Bundled build $bundled_build does not match expected build number $BUILD_NUMBER" >&2
            exit 1
          fi
          architectures="$(lipo -archs "$APP_PATH/Contents/MacOS/MachKit")"
          if [[ " $architectures " != *" arm64 "* || " $architectures " != *" x86_64 "* ]]; then
            echo "Release executable is not universal: $architectures" >&2
            exit 1
          fi

      - name: Sign and verify with Developer ID
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          set -euo pipefail
          codesign \
            --force \
            --timestamp \
            --options runtime \
            --entitlements App/MachKit.entitlements \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple app
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          submission_path="$RUNNER_TEMP/MachKit-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$submission_path"
          xcrun notarytool submit "$submission_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package macOS ZIP
        id: package
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_directory="$GITHUB_WORKSPACE/build/release"
          archive_path="$release_directory/MachKit-$VERSION-macOS.zip"
          mkdir -p "$release_directory"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$archive_path"
          test -s "$archive_path"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="$GITHUB_WORKSPACE/build/release/release-notes.md"
          Scripts/generate_release_notes.sh "$GITHUB_REF_NAME" "$notes_path"
          test -s "$notes_path"
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.package.outputs.path }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE_PATH" \
            --verify-tag \
            --title "MachKit $GITHUB_REF_NAME" \
            --notes-file "$NOTES_PATH"

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          if [[ -n "$KEYCHAIN_PATH" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
