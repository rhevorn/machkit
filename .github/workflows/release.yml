name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(Scripts/validate_release_version.sh "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Release app
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project Sift.xcodeproj \
            -scheme "Sift App" \
            -configuration Release \
            -derivedDataPath build/XcodeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Locate built app
        id: app
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          build_settings="$(xcodebuild \
            -project Sift.xcodeproj \
            -scheme "Sift App" \
            -configuration Release \
            -derivedDataPath build/XcodeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -showBuildSettings)"
          target_build_dir="$(printf '%s\n' "$build_settings" | awk -F ' = ' '/^[[:space:]]*TARGET_BUILD_DIR = / { print $2; exit }')"
          wrapper_name="$(printf '%s\n' "$build_settings" | awk -F ' = ' '/^[[:space:]]*WRAPPER_NAME = / { print $2; exit }')"
          app_path="$target_build_dir/$wrapper_name"
          if [[ -z "$target_build_dir" || -z "$wrapper_name" || ! -d "$app_path" ]]; then
            echo "Unable to locate built app from Xcode build settings: $app_path" >&2
            exit 1
          fi
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Verify bundled version
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          info_plist="$APP_PATH/Contents/Info.plist"
          bundled_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          bundled_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          if [[ "$bundled_version" != "$VERSION" ]]; then
            echo "Bundled version $bundled_version does not match tag version $VERSION" >&2
            exit 1
          fi
          if [[ "$bundled_build" != "$BUILD_NUMBER" ]]; then
            echo "Bundled build $bundled_build does not match GitHub run number $BUILD_NUMBER" >&2
            exit 1
          fi

      - name: Apply and verify ad-hoc signature
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package macOS ZIP
        id: package
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_directory="$GITHUB_WORKSPACE/build/release"
          archive_path="$release_directory/Sift-$VERSION-macOS.zip"
          mkdir -p "$release_directory"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$archive_path"
          test -s "$archive_path"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="$GITHUB_WORKSPACE/build/release/release-notes.md"
          Scripts/generate_release_notes.sh "$GITHUB_REF_NAME" "$notes_path"
          test -s "$notes_path"
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.package.outputs.path }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE_PATH" \
            --verify-tag \
            --title "Sift $GITHUB_REF_NAME" \
            --notes-file "$NOTES_PATH"
