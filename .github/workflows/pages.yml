name: Deploy website to GitHub Pages

# Run after a successful macOS release so download URLs point at the
# published ZIP. Manual dispatch still rebuilds from the selected ref.
on:
  workflow_run:
    workflows:
      - Release macOS app
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag for download links
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "$EVENT_NAME" == "workflow_run" && "$WORKFLOW_HEAD_BRANCH" == v* ]]; then
            tag="$WORKFLOW_HEAD_BRANCH"
          fi
          if [[ -z "$tag" ]]; then
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "Unable to resolve the release tag for website download links." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Baked download tag: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # After a release, build the site from the shipped tag. Manual
          # dispatch keeps the selected branch/commit (usually main).
          ref: ${{ github.event_name == 'workflow_run' && steps.release.outputs.tag || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        working-directory: Website
        run: npm ci

      - name: Test, type-check, and build static website
        working-directory: Website
        env:
          VITE_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: Website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
