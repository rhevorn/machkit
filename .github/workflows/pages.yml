name: Deploy website to GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Resolve release tag for download links
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "Unable to resolve the release tag for website download links." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Baked download tag: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        working-directory: Website
        run: npm ci

      - name: Test, type-check, and build static website
        working-directory: Website
        env:
          VITE_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: Website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
